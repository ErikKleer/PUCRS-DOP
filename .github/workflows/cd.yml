name: Continuous Delivery (CD)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker
        run: |
          docker build -t devops-fase2-app:latest .

      - name: Validação e Teste do Container via Docker Compose
        run: |
          docker compose up -d
          docker ps
          docker compose down
